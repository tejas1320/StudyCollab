{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1>🎯 Create Study Goal</h1>
            <p class="text-muted">
                Set a goal and track your progress.
            </p>
        </div>

        <a href="{{ url_for('dashboard.goals') }}"
           class="btn btn-secondary">
            ← Back to Goals
        </a>
    </div>


    <div class="card shadow-sm p-4" style="max-width: 700px;">

        {% if error %}
        <div class="alert alert-danger">
            {{ error }}
        </div>
        {% endif %}


        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Goal Name
                </label>

                <input
                    type="text"
                    name="goal_name"
                    class="form-control"
                    placeholder="Example: Complete DBMS syllabus"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Target Date
                </label>

                <input
                    type="date"
                    name="target_date"
                    class="form-control"
                    required
                >

            </div>


            <div class="mt-4">

                <button
                    type="submit"
                    class="btn btn-primary">
                    🎯 Create Goal
                </button>

                <a
                    href="{{ url_for('dashboard.goals') }}"
                    class="btn btn-secondary ms-2">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
