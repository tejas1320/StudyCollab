{% extends "base.html" %}

{% block title %}
Add Study Session
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow">

            <div class="card-body p-4">

                <h2 class="mb-2">
                    ⏱️ Record Study Session
                </h2>

                <p class="text-muted mb-4">
                    Record what you studied today.
                </p>


                <form
                    method="POST"
                    action="/study-sessions/add"
                >

                    <!-- Date -->

                    <div class="mb-4">

                        <label class="form-label">
                            Study Date
                        </label>

                        <input
                            type="date"
                            name="study_date"
                            class="form-control"
                            value="{{ current_date }}"
                            required
                        >

                    </div>


                    <!-- Subject -->

                    <div class="mb-4">

                        <label class="form-label">
                            Subject
                        </label>

                        <select
                            name="subject_id"
                            class="form-select"
                            required
                        >

                            <option value="">
                                -- Select Subject --
                            </option>

                            {% for subject in subjects %}

                            <option
                                value="{{ subject.subject_id }}"
                            >
                                {{ subject.subject_name }}
                            </option>

                            {% endfor %}

                        </select>

                    </div>


                    <!-- Duration -->

                    <div class="mb-4">

                        <label class="form-label">
                            Study Duration
                        </label>

                        <div class="input-group">

                            <input
                                type="number"
                                name="duration_minutes"
                                class="form-control"
                                min="1"
                                placeholder="Example: 120"
                                required
                            >

                            <span class="input-group-text">
                                minutes
                            </span>

                        </div>

                        <small class="text-muted">
                            Example: 2 hours = 120 minutes.
                        </small>

                    </div>


                    <!-- Topics -->

                    <div class="mb-4">

                        <label class="form-label">
                            Topics Completed
                        </label>

                        <textarea
                            name="topics_completed"
                            class="form-control"
                            rows="3"
                            placeholder="Example: Normalization, SQL Joins, Transactions"
                        ></textarea>

                    </div>


                    <!-- Notes -->

                    <div class="mb-4">

                        <label class="form-label">
                            Study Notes
                        </label>

                        <textarea
                            name="notes"
                            class="form-control"
                            rows="4"
                            placeholder="How did your study session go?"
                        ></textarea>

                    </div>


                    <div class="d-flex gap-2">

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Save Study Session
                        </button>

                        <a
                            href="/study-sessions"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
