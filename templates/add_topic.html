{% extends "base.html" %}

{% block title %}
Add Topic
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-7">

        <div class="card shadow">

            <div class="card-body p-4">

                <h2 class="mb-2">
                    ➕ Add Topic
                </h2>

                <p class="text-muted mb-4">
                    Subject:
                    <strong>
                        {{ subject.subject_name }}
                    </strong>
                </p>


                <form
                    method="POST"
                    action="/subjects/{{ subject.subject_id }}/topics/add"
                >

                    <div class="mb-4">

                        <label class="form-label">
                            Topic Name
                        </label>

                        <input
                            type="text"
                            name="topic_name"
                            class="form-control"
                            placeholder="Example: Normalization"
                            required
                        >

                    </div>


                    <div class="mb-4">

                        <label class="form-label">
                            Difficulty
                        </label>

                        <select
                            name="difficulty"
                            class="form-select"
                            required
                        >

                            <option value="1">
                                1 - Very Easy
                            </option>

                            <option value="2">
                                2 - Easy
                            </option>

                            <option
                                value="3"
                                selected
                            >
                                3 - Moderate
                            </option>

                            <option value="4">
                                4 - Difficult
                            </option>

                            <option value="5">
                                5 - Very Difficult
                            </option>

                        </select>

                    </div>


                    <div class="mb-4">

                        <label class="form-label">
                            Completion
                        </label>

                        <div class="input-group">

                            <input
                                type="number"
                                name="completion"
                                class="form-control"
                                min="0"
                                max="100"
                                value="0"
                                required
                            >

                            <span class="input-group-text">
                                %
                            </span>

                        </div>

                    </div>


                    <div class="d-flex gap-2">

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Add Topic
                        </button>

                        <a
                            href="/subjects/{{ subject.subject_id }}/topics"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
