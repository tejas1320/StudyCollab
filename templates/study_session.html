{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <h1>📚 Study Session</h1>

    <p class="text-muted">
        Record your study session and track your progress.
    </p>

    <div class="card shadow p-4 mt-4">

        <form method="POST">

            <!-- Subject -->

            <div class="mb-3">

                <label class="form-label">
                    Subject
                </label>

                <select
                    name="subject_id"
                    class="form-select"
                    required
                >

                    <option value="">
                        Select Subject
                    </option>

                    {% for subject in subjects %}

                    <option value="{{ subject.subject_id }}">
                        {{ subject.subject_name }}
                    </option>

                    {% endfor %}

                </select>

            </div>


            <!-- Study Date -->

            <div class="mb-3">

                <label class="form-label">
                    Study Date
                </label>

                <input
                    type="date"
                    name="study_date"
                    class="form-control"
                    value="{{ current_date }}"
                    required
                >

            </div>


            <!-- Duration -->

            <div class="mb-3">

                <label class="form-label">
                    Duration (minutes)
                </label>

                <input
                    type="number"
                    name="duration_minutes"
                    class="form-control"
                    min="1"
                    placeholder="Example: 60"
                    required
                >

            </div>


            <!-- Topics -->

            <div class="mb-3">

                <label class="form-label">
                    Topics Completed
                </label>

                <textarea
                    name="topics_completed"
                    class="form-control"
                    rows="3"
                    placeholder="Example: Normalization, SQL Joins"
                    required
                ></textarea>

            </div>


            <!-- Notes -->

            <div class="mb-3">

                <label class="form-label">
                    Notes
                </label>

                <textarea
                    name="notes"
                    class="form-control"
                    rows="4"
                    placeholder="What did you learn today?"
                ></textarea>

            </div>


            <button
                type="submit"
                class="btn btn-success"
            >
                💾 Save Study Session
            </button>

            <a
                href="/dashboard"
                class="btn btn-secondary ms-2"
            >
                Back to Dashboard
            </a>

        </form>

    </div>

</div>

{% endblock %}
