{% extends "base.html" %}

{% block title %}
Add Exam
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-7">

        <div class="card shadow">

            <div class="card-body p-4">

                <h2 class="mb-2">
                    📅 Add Exam
                </h2>

                <p class="text-muted mb-4">
                    Add an upcoming examination to your planner.
                </p>


                <form
                    method="POST"
                    action="/exams/add"
                >

                    <!-- Exam Name -->

                    <div class="mb-4">

                        <label class="form-label">
                            Exam Name
                        </label>

                        <input
                            type="text"
                            name="exam_name"
                            class="form-control"
                            placeholder="Example: DBMS Internal Assessment"
                            required
                        >

                    </div>


                    <!-- Subject -->

                    <div class="mb-4">

                        <label class="form-label">
                            Subject
                        </label>

                        <select
                            name="subject_id"
                            class="form-select"
                            required
                        >

                            <option value="">
                                -- Select Subject --
                            </option>

                            {% for subject in subjects %}

                            <option
                                value="{{ subject.subject_id }}"
                            >
                                {{ subject.subject_name }}
                            </option>

                            {% endfor %}

                        </select>

                    </div>


                    <!-- Exam Date -->

                    <div class="mb-4">

                        <label class="form-label">
                            Exam Date
                        </label>

                        <input
                            type="date"
                            name="exam_date"
                            class="form-control"
                            min="{{ current_date }}"
                            required
                        >

                    </div>


                    <!-- Total Marks -->

                    <div class="mb-4">

                        <label class="form-label">
                            Total Marks
                        </label>

                        <input
                            type="number"
                            name="total_marks"
                            class="form-control"
                            min="1"
                            value="100"
                            required
                        >

                    </div>


                    <div class="d-flex gap-2">

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Add Exam
                        </button>

                        <a
                            href="/exams"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
